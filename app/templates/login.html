{% extends "base.html" %}
{% block title %}Login · Evaluador{% endblock %}
{% block content %}
<section style="min-height:calc(100vh - 220px);display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy) 0%,var(--indigo) 100%);padding:60px 20px">
  <div style="max-width:420px;width:100%;background:var(--white);border-radius:18px;padding:42px;box-shadow:0 20px 60px rgba(0,0,0,.25)">
    <div style="text-align:center;margin-bottom:32px">
      <div style="width:60px;height:60px;background:var(--coral);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:26px;margin-bottom:14px">CE</div>
      <h1 style="margin:0;font-size:24px;color:var(--navy)">Acceso del evaluador</h1>
      <p style="color:var(--dark);opacity:.7;font-size:13px;margin-top:6px">Centro de Evaluación Cutervo</p>
    </div>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div style="margin-bottom:16px">
        <label style="font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--navy);text-transform:uppercase">Usuario</label>
        <input type="text" name="username" required autofocus style="width:100%;padding:14px 16px;border:1px solid #d8dce4;border-radius:10px;margin-top:6px;font-size:14px">
      </div>
      <div style="margin-bottom:24px">
        <label style="font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--navy);text-transform:uppercase">Contraseña</label>
        <input type="password" name="password" required style="width:100%;padding:14px 16px;border:1px solid #d8dce4;border-radius:10px;margin-top:6px;font-size:14px">
      </div>
      <button class="btn" type="submit" style="width:100%;padding:16px">Entrar</button>
    </form>
    <p style="text-align:center;margin-top:24px;font-size:12px;color:var(--dark);opacity:.6">
      <a href="/" style="color:var(--navy)">← Volver al portal público</a>
    </p>
  </div>
</section>
{% endblock %}
