services:
  app:
    build: .
    container_name: cutervo-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/code/data
      - ./docs:/code/docs:ro
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"

      # ============================
      #   Router HTTPS (puerto 443)
      # ============================
      - "traefik.http.routers.cutervo.rule=Host(`evafinal.metacalidad.cloud`)"
      - "traefik.http.routers.cutervo.entrypoints=https"
      - "traefik.http.routers.cutervo.tls=true"
      - "traefik.http.routers.cutervo.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cutervo.service=cutervo"

      # ============================
      #   Servicio (apunta al puerto interno 8000 de FastAPI)
      # ============================
      - "traefik.http.services.cutervo.loadbalancer.server.port=8000"

      # ============================
      #   Router HTTP (puerto 80) → redirige a HTTPS
      # ============================
      - "traefik.http.routers.cutervo-http.rule=Host(`evafinal.metacalidad.cloud`)"
      - "traefik.http.routers.cutervo-http.entrypoints=http"
      - "traefik.http.routers.cutervo-http.middlewares=cutervo-redir"
      - "traefik.http.middlewares.cutervo-redir.redirectscheme.scheme=https"
      - "traefik.http.middlewares.cutervo-redir.redirectscheme.permanent=true"

networks:
  coolify:
    external: true
